[package]
name = "e710_uhf"
version = "0.2.0"
edition = "2024"
exclude = ["docs/"]
description = "A Rust library for interacting with E710 UHF RFID modules"
license = "MIT"

[dependencies]
log = "0.4.29"


[dev-dependencies]
paste = "1.0.15"
env_logger = "0.11"
chrono = "0.4"
serialport = "4.8.1"



[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install libudev-dev:$CROSS_DEB_ARCH"
]
